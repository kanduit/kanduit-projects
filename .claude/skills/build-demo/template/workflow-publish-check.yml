name: {{TITLE}} · docs sync + quality bar

on:
  push:
    paths:
      - "portfolio/{{SLUG}}/**"
      - "docs/{{SLUG}}/**"
      - ".github/workflows/{{SLUG}}-publish-check.yml"
      - ".claude/skills/build-demo/check_demo.py"
  pull_request:
    paths:
      - "portfolio/{{SLUG}}/**"
      - "docs/{{SLUG}}/**"
      - ".github/workflows/{{SLUG}}-publish-check.yml"
      - ".claude/skills/build-demo/check_demo.py"

jobs:
  check-docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs/ matches source
        run: python3 portfolio/{{SLUG}}/scripts/publish.py --check
      - name: Quality bar
        run: python3 .claude/skills/build-demo/check_demo.py {{SLUG}}
