name: Wärmewende-Monitor Mülheim · docs sync check

# Fails if the published copy under docs/ is out of sync with the source under
# portfolio/. This makes the "edited source but forgot to publish" mistake
# impossible to merge — same guard as the Schulbau-Monitor.
#
# Scoped to the Wärmewende-Monitor Mülheim demo only; other demos are unaffected.

on:
  push:
    paths:
      - "portfolio/waermewende-monitor-muelheim/**"
      - "docs/waermewende-monitor-muelheim/**"
      - ".github/workflows/waermewende-monitor-muelheim-publish-check.yml"
  pull_request:
    paths:
      - "portfolio/waermewende-monitor-muelheim/**"
      - "docs/waermewende-monitor-muelheim/**"
      - ".github/workflows/waermewende-monitor-muelheim-publish-check.yml"

jobs:
  check-docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs/ matches source
        run: python3 portfolio/waermewende-monitor-muelheim/scripts/publish.py --check
