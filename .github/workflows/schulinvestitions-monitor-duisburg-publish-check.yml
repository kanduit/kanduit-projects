name: Schulinvestitions-Monitor Duisburg · docs sync check

# Fails if the published copy under docs/ is out of sync with the source under
# portfolio/. This makes the "edited source but forgot to publish" mistake
# impossible to merge — same guard as the Schulbau-Monitor.
#
# Scoped to the Schulinvestitions-Monitor Duisburg demo only; other demos are unaffected.

on:
  push:
    paths:
      - "portfolio/schulinvestitions-monitor-duisburg/**"
      - "docs/schulinvestitions-monitor-duisburg/**"
      - ".github/workflows/schulinvestitions-monitor-duisburg-publish-check.yml"
  pull_request:
    paths:
      - "portfolio/schulinvestitions-monitor-duisburg/**"
      - "docs/schulinvestitions-monitor-duisburg/**"
      - ".github/workflows/schulinvestitions-monitor-duisburg-publish-check.yml"

jobs:
  check-docs-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs/ matches source
        run: python3 portfolio/schulinvestitions-monitor-duisburg/scripts/publish.py --check
